<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><header><strong>Weather Dashboard</strong><span>Projet de démarrage</span></header><main><h1>Un aperçu du temps.</h1><p>Interface de démonstration : les valeurs ci-dessous sont fictives, sans connexion à un service météo.</p><p><label for="city">Ville </label><select id="city"><option>Paris</option><option>Lyon</option><option>Marseille</option></select></p><article class="card" aria-live="polite"><h2 id="place"></h2><h3 id="temperature"></h3><p id="condition"></p><p id="details"></p></article><p class="muted">Aucune clé API ni géolocalisation nécessaire.</p></main><footer>Weather Dashboard · HTML / CSS / JavaScript</footer></body></html>
